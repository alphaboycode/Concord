[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
# BotChain Testnet RPC configured directly (no .env required)
botchain = "https://rpc.bohr.life"
local = "http://127.0.0.1:8545"

[etherscan]
# BotChain custom explorer at https://scan.bohr.life
