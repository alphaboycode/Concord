[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
# BotChain Mainnet RPC (Chain ID: 677)
botchain = "https://rpc.botchain.ai"
local = "http://127.0.0.1:8545"

[etherscan]
# BotChain mainnet explorer at https://scan.botchain.ai
